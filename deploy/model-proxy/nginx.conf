pid /tmp/model-proxy-nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/model_client_body;
    proxy_temp_path /tmp/model_proxy;
    fastcgi_temp_path /tmp/model_fastcgi;
    uwsgi_temp_path /tmp/model_uwsgi;
    scgi_temp_path /tmp/model_scgi;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 110m;
    proxy_hide_header Location;

    server {
        listen 18080;
        location = /health {
            access_log off;
            return 200 "ok\n";
        }
        location / {
            return 404;
        }
    }

    server {
        listen 11434;
        location / {
            proxy_pass http://host.docker.internal:11434;
            proxy_set_header Host $proxy_host;
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @blocked_redirect;
        }
        location @blocked_redirect {
            internal;
            return 502;
        }
    }

    server {
        listen 8000;
        location / {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $proxy_host;
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @blocked_redirect;
        }
        location @blocked_redirect {
            internal;
            return 502;
        }
    }

    server {
        listen 1234;
        location / {
            proxy_pass http://host.docker.internal:1234;
            proxy_set_header Host $proxy_host;
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @blocked_redirect;
        }
        location @blocked_redirect {
            internal;
            return 502;
        }
    }

    server {
        listen 30000;
        location / {
            proxy_pass http://host.docker.internal:30000;
            proxy_set_header Host $proxy_host;
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @blocked_redirect;
        }
        location @blocked_redirect {
            internal;
            return 502;
        }
    }
}
