name: CI Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 从 GitHub Secrets 注入，避免硬编码密钥进入仓库历史
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      DATABASE_URL: sqlite:///./test.db
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff pytest
      - name: Ruff check
        run: ruff check backend/
      - name: Run tests
        run: python -m pytest backend/tests/ -v --tb=short

  frontend:
    name: Frontend (test + build) + CopilotRuntime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            copilot-runtime/package-lock.json
      - name: Frontend test + build
        working-directory: frontend
        run: npm ci && npm run test && npm run build
      - name: CopilotRuntime build check
        working-directory: copilot-runtime
        run: npm ci && node -c server.js && npm run build:bundle
