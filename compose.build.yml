name: paper-tracker-offline-build

services:
  backend:
    image: paper-tracker-backend:${PAPER_TRACKER_IMAGE_TAG:-offline}
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DEBIAN_MIRROR: ${PAPER_TRACKER_DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${PAPER_TRACKER_DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        PYPI_INDEX_URL: ${PAPER_TRACKER_PYPI_INDEX_URL:-https://pypi.org/simple}

  copilot-runtime:
    image: paper-tracker-copilot-runtime:${PAPER_TRACKER_IMAGE_TAG:-offline}
    platform: linux/amd64
    build:
      context: .
      dockerfile: copilot-runtime/Dockerfile
      args:
        NPM_REGISTRY: ${PAPER_TRACKER_NPM_REGISTRY:-https://registry.npmjs.org}

  gateway:
    image: paper-tracker-gateway:${PAPER_TRACKER_IMAGE_TAG:-offline}
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
      args:
        NPM_REGISTRY: ${PAPER_TRACKER_NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_API_BASE_URL: ""
        VITE_COPILOT_RUNTIME_URL: /api/copilotkit
        VITE_OFFLINE_MODE: "true"
        VITE_ENABLE_RSS: "true"
        PAPER_TRACKER_ALLOW_PDF_EGRESS: "false"
